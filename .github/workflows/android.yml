name: Android build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --no-configuration-cache 2>&1 | tee build.log

      # Puts compiler errors where they show up on the commit page.
      - name: Report errors
        if: failure()
        run: |
          {
            grep -nE "error:|e: |warning: \[|FAILURE|What went wrong|Caused by|> " build.log | head -n 120
            echo "----- tail -----"
            tail -n 60 build.log
          } > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
